<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Cliente - Modern UI</title>
  <style>
    /* ==========================================================================
       DESIGN TOKENS (Baseados no arquivo Design_System_Especificacao.md)
       ========================================================================== */
    :root {
      /* Cores Primárias e Ação */
      --color-primary-500: #2563EB;
      --color-primary-600: #1D4ED8;
      --color-primary-100: #EFF6FF;
      --color-primary-50: #F8FAFC;

      /* Cores Neutras */
      --color-bg-app: #F4F5F7;
      --color-bg-surface: #FFFFFF;
      --color-text-main: #0F172A;
      --color-text-muted: #64748B;
      --color-border-subtle: #E2E8F0;

      /* Cores de Status */
      --status-success-bg: #DCFCE7;
      --status-success-text: #15803D;

      /* Tipografia */
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      /* Bordas e Sombras */
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-full: 9999px;
      --shadow-modal: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-bg-app);
      font-family: var(--font-family);
      color: var(--color-text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* Container Principal */
    .card-container {
      background-color: var(--color-bg-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border-subtle);
      box-shadow: var(--shadow-modal);
      width: 100%;
      max-width: 900px;
      overflow: hidden;
    }

    /* Cabeçalho do Card */
    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--color-border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-main);
    }

    .status-badge {
      background-color: var(--status-success-bg);
      color: var(--status-success-text);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Barra de Ações (Ações Principais) */
    .action-bar {
      padding: 12px 24px;
      background-color: #FAFAFA;
      border-bottom: 1px solid var(--color-border-subtle);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* Navegação por Abas */
    .tabs-navigation {
      display: flex;
      border-bottom: 1px solid var(--color-border-subtle);
      background-color: var(--color-bg-surface);
      padding: 0 24px;
      gap: 24px;
      overflow-x: auto;
    }

    .tab-button {
      padding: 14px 4px;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-muted);
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-button.active {
      color: var(--color-primary-500);
      border-bottom-color: var(--color-primary-500);
      font-weight: 600;
    }

    .tab-button:hover:not(.active) {
      color: var(--color-text-main);
    }

    /* Corpo do Formulário */
    .card-body {
      padding: 24px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Sistema de Grid */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }

    .col-2 { grid-column: span 2; }
    .col-3 { grid-column: span 3; }
    .col-4 { grid-column: span 4; }
    .col-6 { grid-column: span 6; }
    .col-8 { grid-column: span 8; }
    .col-12 { grid-column: span 12; }

    /* Estilização de Campos e Rótulos */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 9px 12px;
      font-size: 13px;
      font-family: var(--font-family);
      color: var(--color-text-main);
      background-color: var(--color-bg-surface);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: var(--color-primary-500);
      box-shadow: 0 0 0 3px var(--color-primary-100);
    }

    /* Input com busca/ícone integrado */
    .input-with-icon {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-with-icon .form-input {
      padding-right: 36px;
    }

    .input-icon-btn {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .input-icon-btn:hover {
      color: var(--color-primary-500);
    }

    /* Estilização dos Botões */
    .btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .btn-primary {
      background-color: var(--color-primary-500);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: var(--color-primary-600);
    }

    .btn-secondary {
      background-color: #FFFFFF;
      border-color: var(--color-border-subtle);
      color: var(--color-text-main);
    }

    .btn-secondary:hover {
      background-color: var(--color-primary-50);
      border-color: var(--color-border-subtle);
    }

    .btn-danger {
      background-color: #FFFFFF;
      border-color: var(--color-border-subtle);
      color: #B91C1C;
    }

    .btn-danger:hover {
      background-color: #FEE2E2;
    }

    /* Seções e Agrupamentos Visuais */
    .form-section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-main);
      margin: 16px 0 8px 0;
      grid-column: span 12;
      border-bottom: 1px solid var(--color-border-subtle);
      padding-bottom: 8px;
    }

    /* Checkbox Personalizado */
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--color-primary-500);
      cursor: pointer;
    }

    .checkbox-group label {
      font-size: 13px;
      color: var(--color-text-main);
      cursor: pointer;
    }

    /* Rodapé com Auditoria */
    .card-footer {
      padding: 12px 24px;
      background-color: var(--color-primary-50);
      border-top: 1px solid var(--color-border-subtle);
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--color-text-muted);
    }

    @media (max-width: 768px) {
      .col-2, .col-3, .col-4, .col-6, .col-8 {
        grid-column: span 12;
      }
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="card-header">
      <h1 class="card-title">Cadastro de Cliente / Fornecedor</h1>
      <span class="status-badge">
        <svg width="8" height="8" viewBox="0 0 8 8" fill="currentColor">
          <circle cx="4" cy="4" r="4"/>
        </svg>
        Ativo
      </span>
    </div>

    <div class="action-bar">
      <button class="btn btn-primary">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Novo
      </button>
      <button class="btn btn-secondary">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        Salvar
      </button>
      <button class="btn btn-secondary">Buscar</button>
      <button class="btn btn-secondary">Imprimir</button>
      <button class="btn btn-danger">Excluir</button>
    </div>

    <div class="tabs-navigation">
      <button class="tab-button active" onclick="switchTab(event, 'tab-identificacao')">1. Identificação</button>
      <button class="tab-button" onclick="switchTab(event, 'tab-endereco')">2. Endereço</button>
      <button class="tab-button" onclick="switchTab(event, 'tab-observacoes')">3. Observações</button>
      <button class="tab-button" onclick="switchTab(event, 'tab-tributacao')">4. Tributação</button>
      <button class="tab-button" onclick="switchTab(event, 'tab-confidencial')">5. Confidencial</button>
      <button class="tab-button" onclick="switchTab(event, 'tab-tabelas')">6. Tabelas</button>
    </div>

    <div class="card-body">
      
      <div id="tab-identificacao" class="tab-content active">
        <div class="form-grid">
          <div class="form-group col-2">
            <label class="form-label">Código</label>
            <input type="text" class="form-input" value="001246" readonly />
          </div>

          <div class="form-group col-4">
            <label class="form-label">Tipo de Pessoa</label>
            <select class="form-select">
              <option>Jurídica</option>
              <option>Física</option>
            </select>
          </div>

          <div class="form-group col-6">
            <label class="form-label">CNPJ / CPF</label>
            <input type="text" class="form-input" placeholder="00.000.000/0000-00" />
          </div>

          <div class="form-group col-6">
            <label class="form-label">Nome / Razão Social</label>
            <input type="text" class="form-input" placeholder="Razão social completa" />
          </div>

          <div class="form-group col-6">
            <label class="form-label">Apelido / Nome Fantasia</label>
            <input type="text" class="form-input" placeholder="Nome comercial" />
          </div>

          <div class="form-group col-4">
            <label class="form-label">Inscrição Estadual</label>
            <input type="text" class="form-input" />
          </div>

          <div class="form-group col-4">
            <label class="form-label">Inscrição Municipal</label>
            <input type="text" class="form-input" />
          </div>

          <div class="form-group col-4">
            <label class="form-label">Data de Cadastro</label>
            <input type="date" class="form-input" value="2026-09-02" />
          </div>

          <div class="form-group col-4">
            <label class="form-label">Telefone Principal</label>
            <input type="text" class="form-input" placeholder="(00) 0000-0000" />
          </div>

          <div class="form-group col-4">
            <label class="form-label">WhatsApp / Celular</label>
            <input type="text" class="form-input" placeholder="(00) 00000-0000" />
          </div>

          <div class="form-group col-4">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-input" placeholder="cliente@empresa.com" />
          </div>
        </div>
      </div>

      <div id="tab-endereco" class="tab-content">
        <div class="form-grid">
          <div class="form-section-title">Endereço Principal / Cobrança</div>
          
          <div class="form-group col-3">
            <label class="form-label">CEP</label>
            <div class="input-with-icon">
              <input type="text" class="form-input" placeholder="00000-000" />
              <button class="input-icon-btn">🔍</button>
            </div>
          </div>

          <div class="form-group col-7">
            <label class="form-label">Rua / Logradouro</label>
            <input type="text" class="form-input" />
          </div>

          <div class="form-group col-2">
            <label class="form-label">Número</label>
            <input type="text" class="form-input" />
          </div>

          <div class="form-group col-4">
            <label class="form-label">Complemento</label>
            <input type="text" class="form-input" />
          </div>

          <div class="form-group col-4">
            <label class="form-label">Bairro</label>
            <input type="text" class="form-input" />
          </div>

          <div class="form-group col-3">
            <label class="form-label">Cidade</label>
            <input type="text" class="form-input" />
          </div>

          <div class="form-group col-1">
            <label class="form-label">UF</label>
            <input type="text" class="form-input" />
          </div>
        </div>
      </div>

      <div id="tab-observacoes" class="tab-content">
        <div class="form-grid">
          <div class="form-group col-12">
            <label class="form-label">Observações Gerais</label>
            <textarea class="form-textarea" placeholder="Insira observações relevantes sobre o cliente..."></textarea>
          </div>

          <div class="form-group col-12">
            <label class="form-label">Lembrete Interno</label>
            <textarea class="form-textarea" placeholder="Notas internas da equipe..."></textarea>
          </div>

          <div class="form-group col-12">
            <div class="checkbox-group">
              <input type="checkbox" id="mostrar-boleto" />
              <label for="mostrar-boleto">Exibir observações no boleto bancário</label>
            </div>
          </div>
        </div>
      </div>

      <div id="tab-tributacao" class="tab-content">
        <div class="form-grid">
          <div class="form-group col-8">
            <label class="form-label">CNAE Principal</label>
            <div class="input-with-icon">
              <input type="text" class="form-input" placeholder="Selecione o CNAE..." />
              <button class="input-icon-btn">🔍</button>
            </div>
          </div>

          <div class="form-group col-4">
            <label class="form-label">E-mail Fiscal (NF-e)</label>
            <input type="email" class="form-input" />
          </div>

          <div class="form-group col-6">
            <div class="checkbox-group">
              <input type="checkbox" id="optante-simples" />
              <label for="optante-simples">Optante pelo Simples Nacional</label>
            </div>
          </div>
        </div>
      </div>

      <div id="tab-confidencial" class="tab-content">
        <div class="form-grid">
          <div class="form-group col-4">
            <label class="form-label">Limite de Crédito (R$)</label>
            <input type="text" class="form-input" value="0,00" />
          </div>

          <div class="form-group col-4">
            <label class="form-label">Conceito do Cliente</label>
            <select class="form-select">
              <option>Sem Classificação</option>
              <option>A - Excelente</option>
              <option>B - Bom</option>
              <option>C - Risco</option>
            </select>
          </div>

          <div class="form-group col-4">
            <label class="form-label">Classificação de Risco</label>
            <select class="form-select">
              <option>Baixo</option>
              <option>Médio</option>
              <option>Alto</option>
            </select>
          </div>

          <div class="form-group col-12">
            <div class="checkbox-group">
              <input type="checkbox" id="bloqueio-atraso" />
              <label for="bloqueio-atraso">Bloquear vendas em caso de parcelas em atraso</label>
            </div>
          </div>
        </div>
      </div>

      <div id="tab-tabelas" class="tab-content">
        <div class="form-grid">
          <div class="form-group col-6">
            <label class="form-label">Vendedor Responsável</label>
            <div class="input-with-icon">
              <input type="text" class="form-input" placeholder="Selecione o funcionário..." />
              <button class="input-icon-btn">🔍</button>
            </div>
          </div>

          <div class="form-group col-6">
            <label class="form-label">Condição de Pagamento Padrão</label>
            <div class="input-with-icon">
              <input type="text" class="form-input" placeholder="Selecione a condição..." />
              <button class="input-icon-btn">🔍</button>
            </div>
          </div>

          <div class="form-group col-6">
            <label class="form-label">Tabela de Preço</label>
            <div class="input-with-icon">
              <input type="text" class="form-input" placeholder="Selecione a tabela..." />
              <button class="input-icon-btn">🔍</button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <div class="card-footer">
      <span>Usuário Inc: <strong>ADMIN</strong></span>
      <span>Últ. Alteração: <strong>02/09/2026 10:40</strong></span>
    </div>
  </div>

  <script>
    function switchTab(event, tabId) {
      // Oculta todas as abas
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => content.classList.remove('active'));

      // Desativa todos os botões
      const buttons = document.querySelectorAll('.tab-button');
      buttons.forEach(btn => btn.classList.remove('active'));

      // Ativa a aba e o botão selecionados
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }
  </script>
</body>
</html>
